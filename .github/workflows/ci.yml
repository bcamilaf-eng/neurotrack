name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  supabase-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migración
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00_auth_stub.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006000000_esquema_inicial.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018000000_comunidad.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018010000_perfil_ampliado.sql
      # Antes que rls_isolation.sql, que concede permisos amplios para sus propias pruebas.
      - name: Comprobar las reglas de la comunidad
        run: |
          out=$(psql -f supabase/tests/community_rls.sql 2>&1)
          echo "$out"
          echo "$out" | grep -q 'Acepta las normas de la comunidad para participar'
          echo "$out" | grep -q 'community_profiles_alias'
          echo "$out" | grep -q 'No puedes reportar lo que escribiste'
          echo "$out" | grep -q 'permission denied for table community_posts'
          echo "$out" | grep -A2 'temas_visibles_para_b' | grep -qE '^\s+1$'
          echo "$out" | grep -A2 'reportes_visibles_para_c' | grep -qE '^\s+1$'
          echo "$out" | grep -A2 'temas_tras_tres_reportes' | grep -qE '^\s+0$'
          echo "$out" | grep -A2 'respuestas_contadas' | grep -qE '^\s+1$'
          echo "$out" | grep -A2 'temas_tras_borrar_cuenta' | grep -qE '^\s+0$'
      - name: Comprobar aislamiento por usuario
        run: |
          out=$(psql -f supabase/tests/rls_isolation.sql 2>&1)
          echo "$out"
          echo "$out" | grep -q 'violates row-level security policy'
          echo "$out" | grep -q 'El episodio no pertenece al usuario'
          echo "$out" | grep -A2 'episodios_visibles_para_b' | grep -qE '^\s+0$'
          echo "$out" | grep -A2 'intensidad_tras_update_de_b' | grep -qE '^\s+8$'
